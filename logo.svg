<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="240" height="240">
  <defs>
    <!-- LEFT page (cyan→blue) -->
    <linearGradient id="pageL" x1="0" y1="0" x2="0.6" y2="1">
      <stop offset="0%"   stop-color="#bfe6ff"/>
      <stop offset="35%"  stop-color="#5fb6ff"/>
      <stop offset="70%"  stop-color="#2466e8"/>
      <stop offset="100%" stop-color="#0c2880"/>
    </linearGradient>
    <!-- RIGHT page (lime→green) -->
    <linearGradient id="pageR" x1="1" y1="0" x2="0.4" y2="1">
      <stop offset="0%"   stop-color="#d2ff8a"/>
      <stop offset="35%"  stop-color="#7ce040"/>
      <stop offset="70%"  stop-color="#26a838"/>
      <stop offset="100%" stop-color="#075e15"/>
    </linearGradient>

    <!-- Edge / inside-spine darks -->
    <linearGradient id="edgeL" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#0a1530"/>
      <stop offset="100%" stop-color="#03081d"/>
    </linearGradient>
    <linearGradient id="edgeR" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#072014"/>
      <stop offset="100%" stop-color="#020a05"/>
    </linearGradient>

    <!-- Top edge highlight -->
    <linearGradient id="topGloss" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"  stop-color="rgba(255,255,255,0.95)"/>
      <stop offset="100%" stop-color="rgba(255,255,255,0)"/>
    </linearGradient>

    <!-- LEAVES -->
    <linearGradient id="leafA" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#dbff8c"/>
      <stop offset="40%"  stop-color="#7be042"/>
      <stop offset="100%" stop-color="#1b7a25"/>
    </linearGradient>
    <linearGradient id="leafB" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#c8ff7e"/>
      <stop offset="40%"  stop-color="#5cd230"/>
      <stop offset="100%" stop-color="#0d6018"/>
    </linearGradient>

    <!-- Halo / magical glow -->
    <radialGradient id="halo" cx="50%" cy="60%" r="55%">
      <stop offset="0%"   stop-color="rgba(126,247,180,0.70)"/>
      <stop offset="50%"  stop-color="rgba(60,160,255,0.30)"/>
      <stop offset="100%" stop-color="transparent"/>
    </radialGradient>

    <!-- Magic ring gradient -->
    <linearGradient id="ringG" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%"   stop-color="rgba(80,180,255,0)"/>
      <stop offset="25%"  stop-color="rgba(126,247,180,0.95)"/>
      <stop offset="55%"  stop-color="rgba(255,255,255,1)"/>
      <stop offset="80%"  stop-color="rgba(126,247,180,0.95)"/>
      <stop offset="100%" stop-color="rgba(80,180,255,0)"/>
    </linearGradient>

    <!-- Soft glow filter -->
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="3" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="bigGlow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="8"/>
    </filter>
  </defs>

  <!-- =========================================================
       BIG BACKGROUND HALO
  ========================================================= -->
  <ellipse cx="120" cy="148" rx="106" ry="58" fill="url(#halo)"/>

  <!-- Magic light streaks -->
  <g opacity="0.85" filter="url(#glow)">
    <ellipse cx="120" cy="170" rx="98"  ry="14" fill="none" stroke="url(#ringG)" stroke-width="3"/>
    <ellipse cx="120" cy="178" rx="86"  ry="11" fill="none" stroke="url(#ringG)" stroke-width="2" opacity="0.7"/>
    <ellipse cx="120" cy="186" rx="74"  ry="8"  fill="none" stroke="url(#ringG)" stroke-width="1.4" opacity="0.55"/>
  </g>

  <!-- Drop shadow under book -->
  <ellipse cx="120" cy="200" rx="64" ry="6" fill="rgba(0,0,0,0.45)"/>

  <!-- =========================================================
       LEFT PAGE
  ========================================================= -->
  <!-- Inner side (depth) -->
  <path d="M30 78
           L30 152
           L112 178
           L112 96 Z"
        fill="url(#edgeL)"/>
  <!-- Front face of left page -->
  <path d="M30 78
           Q60 60 112 60
           L112 178
           Q60 150 30 152 Z"
        fill="url(#pageL)"/>
  <!-- Top glossy edge -->
  <path d="M30 78
           Q60 60 112 60
           L112 70
           Q60 70 30 86 Z"
        fill="url(#topGloss)" opacity="0.7"/>

  <!-- =========================================================
       RIGHT PAGE
  ========================================================= -->
  <path d="M210 78
           L210 152
           L128 178
           L128 96 Z"
        fill="url(#edgeR)"/>
  <path d="M210 78
           Q180 60 128 60
           L128 178
           Q180 150 210 152 Z"
        fill="url(#pageR)"/>
  <path d="M210 78
           Q180 60 128 60
           L128 70
           Q180 70 210 86 Z"
        fill="url(#topGloss)" opacity="0.7"/>

  <!-- Page lines on left -->
  <g stroke="rgba(255,255,255,0.30)" stroke-width="1.4" stroke-linecap="round" opacity="0.6">
    <path d="M44 90 Q72 80 100 80"/>
    <path d="M44 104 Q72 94 100 94"/>
    <path d="M44 118 Q72 108 100 108"/>
    <path d="M44 132 Q72 124 100 124"/>
    <path d="M48 146 Q74 138 100 138"/>
  </g>
  <!-- Page lines on right -->
  <g stroke="rgba(255,255,255,0.32)" stroke-width="1.4" stroke-linecap="round" opacity="0.6">
    <path d="M140 80 Q168 80 196 90"/>
    <path d="M140 94 Q168 94 196 104"/>
    <path d="M140 108 Q168 108 196 118"/>
    <path d="M140 124 Q168 124 196 132"/>
    <path d="M140 138 Q166 138 192 146"/>
  </g>

  <!-- =========================================================
       SPINE
  ========================================================= -->
  <path d="M112 60 L128 60 L128 178 L112 178 Z" fill="url(#edgeL)"/>
  <path d="M112 60 L128 60 L128 66 L112 66 Z" fill="rgba(255,255,255,0.16)"/>

  <!-- =========================================================
       SPEECH-BUBBLE TAIL (bottom V)
  ========================================================= -->
  <path d="M104 174 L120 208 L136 174 Z" fill="#0a1530"/>
  <path d="M108 175 L120 198 L132 175 Z" fill="#0e1d44" opacity="0.6"/>

  <!-- =========================================================
       STEM + LEAVES (sprout from spine)
  ========================================================= -->
  <!-- stem -->
  <path d="M120 60 Q119 50 120 38" stroke="#2c7a2a" stroke-width="3" fill="none" stroke-linecap="round"/>

  <!-- Left leaf -->
  <g filter="url(#glow)">
    <path d="M120 38
             C 96 32, 80 18, 84 6
             C 100 2, 122 18, 120 38 Z"
          fill="url(#leafA)"/>
    <!-- mid vein -->
    <path d="M120 38 C 108 28, 96 18, 88 10"
          stroke="rgba(0,0,0,0.25)" stroke-width="1.4" fill="none" stroke-linecap="round"/>
    <!-- side veins -->
    <path d="M112 30 L102 24" stroke="rgba(0,0,0,0.15)" stroke-width="1" fill="none" stroke-linecap="round"/>
    <path d="M108 24 L100 16" stroke="rgba(0,0,0,0.15)" stroke-width="1" fill="none" stroke-linecap="round"/>
    <!-- leaf shine -->
    <path d="M104 18 C 96 12, 92 10, 90 14" stroke="rgba(255,255,255,0.45)" stroke-width="1" fill="none"/>
  </g>

  <!-- Right leaf -->
  <g filter="url(#glow)">
    <path d="M120 38
             C 144 32, 160 18, 156 6
             C 140 2, 118 18, 120 38 Z"
          fill="url(#leafB)"/>
    <path d="M120 38 C 132 28, 144 18, 152 10"
          stroke="rgba(0,0,0,0.28)" stroke-width="1.4" fill="none" stroke-linecap="round"/>
    <path d="M128 30 L138 24" stroke="rgba(0,0,0,0.16)" stroke-width="1" fill="none" stroke-linecap="round"/>
    <path d="M132 24 L140 16" stroke="rgba(0,0,0,0.16)" stroke-width="1" fill="none" stroke-linecap="round"/>
    <path d="M136 18 C 144 12, 148 10, 150 14" stroke="rgba(255,255,255,0.45)" stroke-width="1" fill="none"/>
  </g>

  <!-- =========================================================
       SPARKLES
  ========================================================= -->
  <g fill="#ffffff">
    <circle cx="36"  cy="70"  r="1.6" opacity="0.95"/>
    <circle cx="200" cy="62"  r="1.4" opacity="0.85"/>
    <circle cx="50"  cy="170" r="1.4" opacity="0.9"/>
    <circle cx="190" cy="178" r="1.6" opacity="0.95"/>
    <circle cx="216" cy="120" r="1.0" opacity="0.8"/>
    <circle cx="24"  cy="128" r="1.0" opacity="0.8"/>
    <circle cx="80"  cy="48"  r="1.2" opacity="0.85"/>
    <circle cx="160" cy="50"  r="1.2" opacity="0.85"/>
  </g>

  <!-- 4-point gold sparkles -->
  <g fill="#ffe680">
    <path d="M48 158 l1.6 -4.4 l1.6 4.4 l4.4 1.6 l-4.4 1.6 l-1.6 4.4 l-1.6 -4.4 l-4.4 -1.6 z"/>
    <path d="M192 152 l1.4 -3.8 l1.4 3.8 l3.8 1.4 l-3.8 1.4 l-1.4 3.8 l-1.4 -3.8 l-3.8 -1.4 z"/>
    <path d="M150 200 l1.0 -2.8 l1.0 2.8 l2.8 1.0 l-2.8 1.0 l-1.0 2.8 l-1.0 -2.8 l-2.8 -1.0 z"/>
    <path d="M82 196 l1.0 -2.6 l1.0 2.6 l2.6 1.0 l-2.6 1.0 l-1.0 2.6 l-1.0 -2.6 l-2.6 -1.0 z"/>
  </g>

  <!-- Big star front-left -->
  <g fill="#ffffff" opacity="0.95">
    <path d="M62 144 l2 -5 l2 5 l5 2 l-5 2 l-2 5 l-2 -5 l-5 -2 z"/>
  </g>
</svg>
