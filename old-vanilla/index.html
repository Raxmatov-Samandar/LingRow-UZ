<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>LingRow — Choose a Level</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css" />
</head>
<body>

<div id="cosmos-mount"></div>

<div class="app">
  <div id="sidebar-mount" data-active="dashboard"></div>
  <!-- Sidebar including new book-and-leaf logo is rendered by shared.js -->

  <main class="main">

    <header class="topbar">
      <div class="search glass-soft">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round">
          <circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/>
        </svg>
        <input type="text" placeholder="Search" />
      </div>

      <div class="topbar-actions">
        <button class="icon-btn" aria-label="Apps">
          <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.8">
            <rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/>
            <rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/>
          </svg>
        </button>
        <button class="icon-btn has-dot" aria-label="Notifications">
          <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
            <path d="M6 8a6 6 0 1112 0c0 7 3 8 3 8H3s3-1 3-8z"/><path d="M10 21a2 2 0 004 0"/>
          </svg>
        </button>
        <div class="avatar">
          <div class="avatar-ring"></div>
          <img src="https://images.unsplash.com/photo-1494790108377-be9c29b29330?w=200&q=80" alt="Profile" onerror="this.style.display='none'; this.parentElement.classList.add('avatar-fallback')"/>
          <span class="avatar-letter">A</span>
        </div>
      </div>
    </header>

    <section class="content">

      <div class="levels-area">
        <div class="hero">
          <h2 class="hero-title">Choose a Level</h2>
          <p class="hero-sub">Choose your level to start your language learning journey</p>
        </div>

        <div class="cards">

          <article class="level-card" style="--accent:#7ef7d3;--tint:rgba(126,247,211,.18);">
            <div class="card-stack">
              <div class="stack stack-2"></div>
              <div class="stack stack-1"></div>
              <a class="card glass-card" href="lesson.html">
                <div class="card-top">
                  <div class="card-text">
                    <h3>Beginner</h3>
                    <p>Crystal glass texture</p>
                  </div>
                </div>
                <div class="card-icon">
                  <svg viewBox="0 0 24 24" width="34" height="34" fill="none" stroke="#7ef7d3" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M3 5h7M6.5 5v3"/><path d="M3 13c2-3 5-5 7-5"/><path d="M14 21l5-12 5 12"/><path d="M16 17h6"/>
                  </svg>
                </div>
                <div class="card-bottom">
                  <span class="learn-label">Learn</span>
                  <span class="cta">
                    <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="#0b1f1a" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
                      <path d="M5 12h14"/><path d="M13 5l7 7-7 7"/>
                    </svg>
                  </span>
                </div>
                <div class="shine"></div>
              </a>
            </div>
          </article>

          <article class="level-card" style="--accent:#7ef7d3;--tint:rgba(126,247,211,.14);">
            <div class="card-stack">
              <div class="stack stack-2"></div>
              <div class="stack stack-1"></div>
              <a class="card glass-card" href="lesson.html">
                <div class="card-top">
                  <div class="card-text">
                    <h3>Intermediate</h3>
                    <p>Crystal glass texture</p>
                  </div>
                </div>
                <div class="card-icon">
                  <svg viewBox="0 0 24 24" width="34" height="34" fill="none" stroke="#7ef7d3" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M3 5h7M6.5 5v3"/><path d="M3 13c2-3 5-5 7-5"/><path d="M14 21l5-12 5 12"/><path d="M16 17h6"/>
                  </svg>
                </div>
                <div class="card-bottom">
                  <span class="learn-label">Learn</span>
                  <span class="cta">
                    <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="#0b1f1a" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
                      <path d="M5 12h14"/><path d="M13 5l7 7-7 7"/>
                    </svg>
                  </span>
                </div>
                <div class="shine"></div>
              </a>
            </div>
          </article>

          <article class="level-card" style="--accent:#7ef7d3;--tint:rgba(126,247,211,.14);">
            <div class="card-stack">
              <div class="stack stack-2"></div>
              <div class="stack stack-1"></div>
              <a class="card glass-card" href="lesson.html">
                <div class="card-top">
                  <div class="card-text">
                    <h3>Advanced</h3>
                    <p>Crystal glass texture</p>
                  </div>
                </div>
                <div class="card-icon">
                  <svg viewBox="0 0 24 24" width="34" height="34" fill="none" stroke="#a59bff" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M3 5h7M6.5 5v3"/><path d="M3 13c2-3 5-5 7-5"/><path d="M14 21l5-12 5 12"/><path d="M16 17h6"/>
                  </svg>
                </div>
                <div class="card-bottom">
                  <span class="learn-label">Learn</span>
                  <span class="cta">
                    <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="#0b1f1a" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
                      <path d="M5 12h14"/><path d="M13 5l7 7-7 7"/>
                    </svg>
                  </span>
                </div>
                <div class="shine"></div>
              </a>
            </div>
          </article>

          <article class="level-card" style="--accent:#7ef7d3;--tint:rgba(126,247,211,.14);">
            <div class="card-stack">
              <div class="stack stack-2"></div>
              <div class="stack stack-1"></div>
              <a class="card glass-card" href="lesson.html">
                <div class="card-top">
                  <div class="card-text">
                    <h3>Mastery</h3>
                    <p>Crystal glass texture</p>
                  </div>
                </div>
                <div class="card-icon">
                  <svg viewBox="0 0 24 24" width="34" height="34" fill="none" stroke="#5aa9ff" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M5 12c3 0 6-3 6-6 0 3 3 6 6 6-3 0-6 3-6 6 0-3-3-6-6-6z"/><path d="M11 18v3"/>
                  </svg>
                </div>
                <div class="card-bottom">
                  <span class="learn-label">Learn</span>
                  <span class="cta">
                    <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="#0b1f1a" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
                      <path d="M5 12h14"/><path d="M13 5l7 7-7 7"/>
                    </svg>
                  </span>
                </div>
                <div class="shine"></div>
              </a>
            </div>
          </article>

        </div>
      </div>

      <aside class="lesson glass-card-tall">
        <div class="lesson-head">
          <p class="lesson-eyebrow">Lesson 1:</p>
          <h3 class="lesson-title">Greetings</h3>
          <p class="lesson-meta">30 lessons / 30 play</p>
        </div>

        <a href="lesson.html" class="play-btn" aria-label="Play">
          <span class="play-glow"></span>
          <span class="play-ring"></span>
          <span class="play-core">
            <svg viewBox="0 0 24 24" width="34" height="34" fill="#fff" stroke="none">
              <path d="M8 5.5v13l11-6.5z"/>
            </svg>
          </span>
        </a>

        <p class="lesson-progress">1 / 30</p>
      </aside>

    </section>

    <span class="float-glyph fg-1">
      <svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="#7ef7d3" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
        <path d="M3 5h7M6.5 5v3"/><path d="M3 13c2-3 5-5 7-5"/>
        <path d="M14 21l5-12 5 12"/><path d="M16 17h6"/>
      </svg>
    </span>
    <span class="float-glyph fg-2">
      <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="#a59bff" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="12" cy="6" r="2"/><path d="M12 8v6"/><path d="M8 14h8"/><path d="M9 22l3-6 3 6"/>
      </svg>
    </span>
    <span class="float-glyph fg-3">
      <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="#5aa9ff" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
        <path d="M12 2l2 6 6 1-4.5 4 1.5 6L12 16l-5 3 1.5-6L4 9l6-1z"/>
      </svg>
    </span>
    <span class="float-glyph fg-4 sparkle"></span>

  </main>
</div>

<script src="shared.js"></script>
<script>
  document.querySelectorAll('.level-card').forEach(card => {
    card.addEventListener('mousemove', e => {
      const r = card.getBoundingClientRect();
      const x = (e.clientX - r.left) / r.width - 0.5;
      const y = (e.clientY - r.top) / r.height - 0.5;
      card.style.setProperty('--rx', (y * -6).toFixed(2) + 'deg');
      card.style.setProperty('--ry', (x * 8).toFixed(2) + 'deg');
      card.style.setProperty('--mx', (x * 100 + 50).toFixed(0) + '%');
      card.style.setProperty('--my', (y * 100 + 50).toFixed(0) + '%');
    });
    card.addEventListener('mouseleave', () => {
      card.style.setProperty('--rx', '0deg');
      card.style.setProperty('--ry', '0deg');
    });
  });
</script>

</body>
</html>
